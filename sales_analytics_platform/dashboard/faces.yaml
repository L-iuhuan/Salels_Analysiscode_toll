
# 面注册表（W4 测试版 · 设计依据 docs\看板叙事结构详细设计_20260825.md §4）
# 口径文案规范（v5，2026-08-26 用户拍板升级为问题驱动自解释）：
#   简明公式 + 通俗名词 + 关键阈值/截断/排序口径必须写明（数据来自代码取证，勿凭印象写）；
#   复杂图表配 chart_guides_detailed 详注（渲染为标题旁 ❓ 按钮弹层）。
# 维护人：用户本人（口径与行动清单内容的唯一维护人；改本文件后重跑生成器生效）
# 字母 id 仅供内部使用，不进 UI；tab 显示中文 name。
version: "1"

faces:
  A:
    id: A
    name: 总览决策
    theme: 经营总览（总体 + 常用维度速览）
    enabled: true
    cadence: monthly
    visible: true
    owner: 数据分析组
    description: 整体经营结果与产品线/品类/客户层级等常用维度摘要
    sections:
      - title: YTD 指标卡
        definition: 本年度 1 月至最新数据月的累计经营结果
        koujing: 收入按不含税金额计；毛利率 = 毛利 ÷ 收入；ASP = 收入 ÷ 发货数量；新品渗透率 = ERP"是否新品"标记的收入 ÷ 总收入
        usage: 先看总收入和毛利率同比，再判断 KA+AA 收入占比
        update_note: 每月刷新
      - title: 常用维度摘要
        definition: 产品线/品类/客户层级等维度的 Top-N 摘要
        koujing: 按维度聚合本年累计收入与毛利
        usage: 速览不下沉，明细引专面
        update_note: 每月刷新
      - title: 产品型号变迁
        definition: KA/AA 客户近 12 月与前 12 月的产品型号新增/流失数量摘要
        koujing: 以月聚合销量 ≥6000 颗为门槛（客户×月×品种聚合后判定）统计型号变化；与 E 面"首次大量导入"的单订单行口径不同，勿混用
        usage: 快速感知核心客户的产品结构异动
        update_note: 每月刷新
    chart_guides:
      mainBar: 堆叠柱展示历年月度成本、毛利与毛利率走势，观察整体经营节奏
      pieChart: 按 KA/AA/KM/MM 分层展示客户数量结构
      kaaaLine: 展示 KA+AA 核心客户群月度收入变化
      scatter: 横轴为 YTD 同比收入增长率，纵轴为毛利率，每个点是一个 KA 客户
      margin: 产品线/品类维度 YTD 收入与毛利率 Top 摘要
      list: KA/AA 核心客户精简信息，点击客户名可跳转 B 面下钻
      prodChange: 对比近 12 月与前 12 月，统计核心客户产品型号的新增与流失
    chart_guides_detailed:
      scatter: |
        <p><b>过滤规则：</b>仅展示 YTD 收入>0 且 |YTD同比增速|<500% 的 KA 客户（剔除数据异常点）。</p>
        <p><b>分色逻辑：</b>按 KA 群体毛利率中位数分界——高毛利&下滑（蓝）、低毛利&增长（橙，增收不增利）、高毛利&增长（绿，双优）、其余灰。</p>
        <p><b>读图：</b>点击任意气泡可跳转 B 面查看该客户详情。</p>
    glossary:
      - term: YTD
        definition: 本年度 1 月至最新数据月的累计值
      - term: ASP
        definition: 平均售价 = 收入 ÷ 发货数量
      - term: KA+AA
        definition: 核心客户层级，KA 为战略大客户，AA 为重点客户

  R:
    id: R
    name: 风险与行动
    theme: 当月风险信号与待办事项
    enabled: true
    cadence: monthly
    visible: true
    owner: 销售运营组
    description: 数据驱动风险与会议跟踪项，经人工审定后展示
    sections:
      - title: 当月风险摘要
        definition: 经人工审定的当月重点风险事项
        koujing: 初稿规则：①客户营收异动=当月收入环比变化>±50%（上月=0且本月>0记为新导入）；②负毛利产品=损失≥1万元；③每类取Top10、同客户合并取最高等级；④会议跟踪项人工录入。仅"待处理/跟进中"跨月结转，已关闭项永久存档不展示
        usage: 定位本月需要处理的客户与产品
        update_note: 每月跑批生成初稿
      - title: 行动清单
        definition: 审定后的待办事项，支持状态跟踪
        koujing: 状态 = 待处理 / 跟进中 / 已关闭
        usage: 分配负责人、记录备注、跟踪进度
        update_note: 每月结转，状态跨月持久
      - title: 口径说明
        definition: 面级口径条 + 图表级导读 + 指标级术语卡
        koujing: 见各面 faces.yaml 配置
        usage: 看不懂某一面、某张图、某个指标时查阅
        update_note: 随配置更新
    chart_guides: {}
    glossary:
      - term: 行动状态
        definition: 待处理（未开始）/ 跟进中（进行中）/ 已关闭（完成或放弃，存档不展示）
      - term: 结转规则
        definition: 每月跑批时仅结转待处理与跟进中项；已关闭项写入 action_items.json 永久保留

  B:
    id: B
    name: 客户360
    theme: 以客户为轴心的下钻分析
    enabled: true
    cadence: monthly
    visible: true
    owner: 数据分析组
    description: 单个客户的长期趋势、品类构成、新品与风险
    sections:
      - title: 客户列表
        definition: 全部客户的层级、活跃状态、风险等级，可筛选与下钻
        koujing: 活跃状态按近期采购情况判定；RFM = 按最近购买、频率、金额三维度的客户价值模型
        usage: 左侧筛选并点选客户，右侧查看详情
        update_note: 每月刷新
      - title: 客户详情
        definition: 单个客户近 25 个月的收入、毛利、品类、品种、新品与风险趋势
        koujing: 趋势按自然月聚合；品类与品种按客户采购明细统计
        usage: 用于客户拜访前快速备课与异常诊断
        update_note: 每月刷新
      - title: 采购节律
        definition: 基于历史采购间隔推算预计下次采购时间与近 6 月频次
        koujing: 采购周期 = 历史订单间隔均值；预计下次 = 上次采购日 + 平均周期
        usage: 判断客户是否到采购窗口、是否存在流失迹象
        update_note: 每月刷新
    chart_guides:
      list: 左侧筛选并点选客户，右侧展示该客户详细分析
      trend: 单个客户近 12 个月收入与毛利走势
      qty: 单个客户销量按月或按季度的变化趋势
    glossary:
      - term: RFM
        definition: 按最近购买（Recency）、购买频率（Frequency）、购买金额（Monetary）三维度评估客户价值的模型
      - term: 活跃状态
        definition: 近12月收入=0→非活跃；0<收入<全体有收入客户近12月收入的P25分位→微量活跃；≥P25→活跃
      - term: 采购周期
        definition: 客户历史订单之间的平均间隔天数
      - term: 综合价值分
        definition: 五维加权：价值贡献35%+增长动能25%+稳定关系20%+战略潜力15%+效率运营5%；层级阈值 S≥34/A≥28/B≥22/C<22

  C:
    id: C
    name: 产品生命周期
    theme: 以 SKU 为轴心的生命周期与风险分析
    enabled: true
    cadence: monthly
    visible: true
    owner: 产品分析组
    description: 产品画像、风险等级、生命周期阶段与策略建议
    sections:
      - title: 产品健康度
        definition: 全部 SKU 的画像、风险等级、生命周期阶段分布
        koujing: 生命周期阶段 = 导入 / 成长 / 成熟 / 衰退（按销售走势划分）；九宫格阈值：销量动能加速≥+15%/萎缩≤-10%，盈利健康毛利率≥70%为健康/≤50%为严重侵蚀
        usage: 先关注高风险与衰退/夕阳产品数量
        update_note: 每月刷新
      - title: 多维筛选
        definition: 按画像、风险、帕累托、参照组、销量动能、盈利健康、ASP 趋势等维度筛选产品
        koujing: 各维度均基于近 12 月销量与毛利计算
        usage: 快速定位需要重点关注的 SKU 群体
        update_note: 每月刷新
      - title: 产品明细
        definition: 列出每个 SKU 的策略建议与关键指标
        koujing: 综合评分四因子加权：增速衰减60%+自比健康度20%+毛利率趋势斜率10%+订货量变化10%（不可靠因子自动归零并归一化）
        usage: 点击行查看历史画像追踪与策略建议
        update_note: 每月刷新
    chart_guides:
      portrait: 全部 SKU 当前生命周期画像分布
      risk: 全部 SKU 综合风险等级分布
      pareto: 按收入贡献与毛利贡献划分的帕累托分类
      scatter: 横轴为近 12 月毛利率，纵轴为近 12 月增长率，气泡大小代表销量
      sankey: 销量 Top100 产品近四个季度画像流转路径
    chart_guides_detailed:
      scatter: |
        <p><b>轴向：</b>横轴=近12月毛利率%，纵轴=近12月增长率%，气泡大小=近12月销量，颜色=综合风险等级。</p>
        <p><b>轴截断：</b>坐标轴范围按全量产品群体的毛利率/增长率 1%~99% 分位数截断——极端值产品仍在明细表中，只是不在图上，避免轴被拉扁看不见主体。</p>
      sankey: |
        <p><b>取数：</b>按近12月销量取 Top100 产品，追踪近四个季度的九宫格画像流转。</p>
        <p><b>九宫格阈值：</b>销量动能 加速增长≥+15%、萎缩≤-10%；盈利健康 毛利率≥70%为健康、≤50%为严重侵蚀或同比下滑超10pp。</p>
    glossary:
      - term: 画像
        definition: 综合销量、增长、盈利等特征给 SKU 打上的生命周期标签
      - term: 帕累托分类
        definition: 按收入贡献与毛利贡献将产品分为 stars / cash cows / question marks / dogs 等
      - term: 综合风险等级
        definition: 四因子加权评分（斜率10%+增速衰减60%+自比健康20%+订货量10%）；等级阈值 低≤55/中≤65/高≤68/极高>68，且订货量与毛利率斜率双高时强制极高

  D:
    id: D
    name: 销售能力
    theme: 以销售员/部门为轴心的能力与业绩评估
    enabled: true
    cadence: monthly
    visible: true
    owner: 销售运营组
    description: 销售员业绩、能力画像、客户覆盖与品类热度
    sections:
      - title: 团队 KPI
        definition: 销售团队 YTD 营收、毛利、人均产出、A级占比等顶层指标
        koujing: 人均营收 = 团队 YTD 收入 ÷ 团队在职人数；A级占比 = A级销售员 ÷ 团队人数
        usage: 先看团队总营收与毛利率，再下钻人均与结构
        update_note: 每月刷新
      - title: 销售员排名
        definition: 按收入、毛利、同比、环比、能力分等维度排序的销售员清单
        koujing: 业绩按业务员归属的收入与毛利计
        usage: 看排名、点选行查看画像与热力图
        update_note: 每月刷新
      - title: 能力画像
        definition: 单个销售员在贡献、维系、拓展、定价等九维能力的雷达评估
        koujing: 九维加权：绝对贡献35%+维系10%+拓展10%+升级10%+新客8%+结构优化8%+抗风险7%+定价6%+激活6%；50分为团队均值基准；能力等级按亚组内百分位 ≥70%A/≥40%B/≥25%C/其余D
        usage: 对比个人与团队均值，识别优势与短板
        update_note: 每月刷新
      - title: 品类/客户热力图
        definition: 销售员与品类、销售员与客户的交叉收入/利润矩阵
        koujing: 按销售员归属汇总 YTD 收入或利润
        usage: 发现品类覆盖空白与客户利润集中风险
        update_note: 每月刷新
    chart_guides:
      ranking: 全团队销售员多维排名，点击行查看详情
      radar: 选中销售员与团队均值的能力九维对比
      bubble: 横轴为 YTD 收入，纵轴为毛利率，气泡大小为客户数
      teamTrend: 团队或指定销售员月度成本、毛利与毛利率趋势
      custHeatmap: Top33客户×Top15销售员交叉的YTD利润热力分布；行=客户（按YTD收入选Top33，选取按收入、展示为利润）；列=销售员（按正利润合计取Top15）；色阶上限=单元格利润95分位
      waterfall: 所选销售员五维能力得分与团队均值的逐项落差拆解
      heatmap: Top15 品类 × Top15 销售员的 YTD 收入热力分布；行=品类按YTD收入Top15；列=销售员按这15个品类内收入合计取Top15（非全量收入排名）
    chart_guides_detailed:
      custHeatmap: |
        <p><b>行列口径：</b>行=客户（按 YTD 收入选 Top33——注意选取按收入、格子展示的是利润）；列=销售员（按正利润合计取 Top15）。</p>
        <p><b>色阶截断：</b>上限=单元格利润 95 分位，防止单个极大值把其他格子压成浅色；超出截断值的格子按最深色显示，悬停仍显示真实值。</p>
      bubble: |
        <p><b>轴向：</b>横轴=YTD收入、纵轴=毛利率、气泡大小=客户数、颜色=亚组类型。</p>
        <p><b>轴截断：</b>横轴按销售员 YTD 收入 2%~98% 分位截断并过滤极端值，首尾约2%的销售员不在此图（完整名单见上方排名表）。</p>
    glossary:
      - term: 能力九维
        definition: 贡献力、维系力、拓展力、定价力、新客力、激活力、升级力、优化力、抗风险力
      - term: A级销售
        definition: 绩效数据"能力等级"字段评定为A级的销售员（等级由绩效侧评定，看板不自算阈值）
      - term: 亚组
        definition: 按客户结构与业绩特征将销售员分为均衡型、大客户型、批量型等

  E:
    id: E
    name: 月度作战雷达
    theme: 月度级次的执行作战视图
    enabled: true
    cadence: monthly
    visible: true
    owner: 数据分析组
    description: 当月客户异动、量利拆解、首次导入与销售贡献
    sections:
      - title: 月度 KPI
        definition: 所选月份区间的收入、毛利、ASP、发货量、活跃客户、首次导入数
        koujing: 环比 = 与上月比；同比 = 与去年同月比
        usage: 先总览当月经营结果，再下钻异动
        update_note: 每月刷新
      - title: 客户势能矩阵
        definition: 所选月份客户的同比增长率 vs 毛利率分布
        koujing: 横轴为客户收入增长率，纵轴为客户毛利率
        usage: 定位当月异动客户，识别高增/下滑/高利润/低利润群体
        update_note: 每月刷新
      - title: 量利拆解
        definition: 按产品线、KA客户、AA客户、Top10品类拆解环比收入变化
        koujing: 量贡献 = Δ销量 × 上期均价；价贡献 = Δ均价 × 上期销量；两者之和≈收入Δ（交叉项未摊分）；毛利Δ单独展示、不属于收入变化的组成
        usage: 判断收入波动来自销量还是价格因素
        update_note: 每月刷新
      - title: 首次大量导入
        definition: 当月首次发货量 ≥6000 颗的产品/客户导入记录
        koujing: 首次大量导入 = 单笔订单行销量 ≥6000 颗且历史上未出现过（单行口径，非月聚合）
        usage: 跟踪新品与新客户的市场导入进度
        update_note: 每月刷新
    chart_guides:
      matrix: 横轴为客户收入增长率，纵轴为毛利率，用于定位月度异动客户
      penetration: KA/AA/KM/MM 四类客户月度收入构成趋势
      decomp: 按产品线/客户/品类拆解收入环比变化，区分量贡献与价贡献
      import: 当月首次大量导入按销售员聚合的个数与收入
    chart_guides_detailed:
      decomp: |
        <p><b>计算公式（环比）：</b>量贡献 = Δ销量 × 上期均价；价贡献 = Δ均价 × 上期销量。</p>
        <p><b>残差说明：</b>量贡献+价贡献 ≈ 但不严格等于收入Δ——交叉项（Δ销量×Δ均价）未做摊分；新增项（上期销量=0）按量贡献=当期收入计。</p>
        <p><b>毛利Δ：</b>单独列出，不属于收入变化的组成部分。</p>
    glossary:
      - term: 环比
        definition: 与上一个统计周期相比，如本月 vs 上月
      - term: 同比
        definition: 与去年同期相比，如今年某月 vs 去年同月
      - term: 量贡献/价贡献
        definition: 将收入变化拆分为销量变动带来的部分与平均售价变动带来的部分

  F:
    id: F
    name: 半年度专项
    theme: 上半年/下半年经营复盘专项
    enabled: true
    cadence: half_year
    visible: false   # 平时彻底关闭（用户拍板 2026-08-25）；半年度复盘期由人工核定改 true 开启
    owner: 数据分析组
    description: 半年度产品线/品类/部门/客户/新品多维对比
    sections:
      - title: 半年度复盘
        definition: 半年度的多维经营对比
        koujing: H1 = 上半年（1-6 月）；H2 = 下半年（7-12 月）
        usage: 半年度复盘会议使用
        update_note: 半年度更新，平时关闭
